# About Section
# about_title: About Me
about_profile_image: images/profile.jpeg
about_content: | # this will include new lines to allow paragraphs
  I'm a Senior Software Engineer based in Spain, working fully remote. For the last five years I have been at
  Klarna in the KYC domain, as the technical anchor of the team that designed, built and rolled out the service
  that now runs identity verification for every Klarna product, in every market Klarna operates in.

  I work mostly in TypeScript and Node on AWS, on event-driven systems that have to be correct, auditable and
  always available — KYC is a regulated domain, so "mostly working" is not an option. Team leads around me have
  changed several times; I have been the constant: the person who reviews the risky changes and the one new
  engineers come to when they are stuck.

  I am looking for a place small enough that this matters — a startup or a small company where I can own real
  problems end to end and grow with it.

  Core: <mark>TypeScript</mark> <mark>Node.js</mark> <mark>AWS</mark> <mark>Event-driven architecture</mark> <mark>System design</mark>

  Infrastructure: <mark>DynamoDB</mark> <mark>Kafka</mark> <mark>SQS</mark> <mark>Kinesis Firehose</mark> <mark>Terraform</mark> <mark>Docker</mark> <mark>Jenkins</mark>

  Also: <mark>React</mark> <mark>Next JS</mark> <mark>GraphQL</mark> <mark>React Native</mark> <mark>Python</mark> <mark>Java</mark> <mark>nginx</mark>

  Spanish (native) · English (fluent — my working language for the last five years)

content:
  - title: Experience # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        title: Klarna
        link: https://klarna.com
        sub_title: Senior Software Engineer
        caption: December 2021 - Present
        quote: >
          Buy now, pay later.
        description: | # this will include new lines to allow paragraphs
          Senior Software Engineer in the KYC domain, and the de facto technical lead of the team.

          - Designed and built the service that now handles KYC for every Klarna product across every market:
            all of Europe (including the UK and Switzerland), the US, Canada, Mexico and Australia. It serves
            <mark>tens of millions of verification sessions every week</mark> for <mark>15+ product teams</mark>.
          - Built it as an event-driven system in TypeScript and Node on AWS — DynamoDB, SQS and Kinesis
            Firehose — with Kafka for event streaming and Terraform for infrastructure.
          - Led the replacement of the previous solution, whose logic was scattered across several legacy
            services. The migration took over a year and is 100% complete — no KYC logic lives outside the
            platform any more.
          - Own the technical bar of the service: every risky change goes through my review, and I am the
            person the team asks when something is unclear or on fire.
          - Drove cross-team integrations, including headless verification flows for onboarding and the KYC
            rollout for Klarna's launch with Apple in the US.
          - On call for a system where an outage blocks purchases and a compliance gap is not recoverable.
          - Onboarded and mentored around 15 engineers as the team grew and reshaped. Team leads changed
            several times over these years; I was the continuity between them.
          - Work daily with financial regulation across jurisdictions — AML requirements, PII handling and
            audit trails — translating compliance constraints into system design.
          - Promoted to Senior Software Engineer in May 2023, with further sub-level promotions and
            performance awards in the years since.
          - The team ships entirely with AI assistance today: 100% of our changes are written with Claude.
      - layout: left
        title: Capitole Consulting
        link: https://capitole-consulting.com
        sub_title: Software Engineer
        caption: March 2021 - December 2021
        quote: >
          Growing fast, growing good.
        description: | # this will include new lines to allow paragraphs
          Consultant in a team of ten to fifteen people, building new functionality for the company's flagship
          product and supporting the clients running it.
      - layout: left
        title: Boorpret
        link: https://boorpret.com
        sub_title: Co-founder & Software Engineer
        caption: September 2019 - December 2020
        quote: >
          Making ideas a reality.
        description: | # this will include new lines to allow paragraphs
          I co-founded Boorpret with friends from university: a company building web and mobile applications,
          and graphic design work. I talked to clients, wrote contracts, managed a small team of developers,
          and built the backend skeleton every one of our applications was based on. We started from zero and
          kept it running for over a year — and it is still going today, without me.
      - layout: left
        title: Ayesa
        link: https://ayesa.com
        sub_title: Junior Full-stack Developer
        caption: April 2018 - March 2019
        quote: >
          First job, first contact with a large company.
        description: | # this will include new lines to allow paragraphs
          Part of an eight-person team building an internal platform with <mark>Angular 8</mark> on the
          frontend and <mark>Java</mark> on the backend. Despite being the junior on the team I had a lot of
          autonomy, and ended up reviewing code and teaching parts of the stack to my teammates.
      - layout: left
        title: Prise
        link: https://prise.es
        sub_title: Software Engineering Intern
        caption: September 2017 - March 2018
        quote: >
          A great internship with fantastic professionals.
        description: | # this will include new lines to allow paragraphs
          I started by writing automated tests that checked, day after day, that the company's services were
          still alive. After that I built an internal dashboard for measuring the company's resource usage.

